[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dig-rl"
version = "0.1.0"
description = "Demonstration-gradient prediction with pre-rollout Bernoulli residual correction"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "torch>=2.6,<3"]

[project.optional-dependencies]
server = ["transformers>=5.3,<6", "peft>=0.18,<1", "accelerate>=1.4,<2", "datasets>=3,<6", "huggingface-hub>=1,<2", "httpx[socks]>=0.28,<1", "pillow>=10", "psutil>=5.9"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
